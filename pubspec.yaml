name: shoe_micro_interactions_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  archify: ^1.1.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/box/
    - assets/images/shoe/
    - assets/images/truck/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
          weight: 100
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
          weight: 200
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
          weight: 900
        - asset: assets/fonts/Montserrat-Italic-VariableFont_wght.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Montserrat-Italic-VariableFont_wght.ttf
          weight: 700
          style: italic
